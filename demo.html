<title>Trip Binder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root{
  --ground:#FBFBFC; --panel:#FFFFFF; --rail-bg:#F5F6F8;
  --ink:#16181D; --ink-2:#4A5059; --ink-3:#787F8A;
  --line:#E4E6EB; --line-2:#EDEFF2;
  --accent:#16181D; --accent-soft:#F0F1F3; --accent-ink:#000000;
  --flag:#16181D; --flag-soft:#EEEFF1;
  --bubble:#F2F4F6;
  --rail:252px;
  --sh:0 1px 2px rgba(22,24,29,.05), 0 8px 24px -16px rgba(22,24,29,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101215; --panel:#17191D; --rail-bg:#131518;
    --ink:#E8EAED; --ink-2:#A7AEB8; --ink-3:#787F8A;
    --line:#282B31; --line-2:#212429;
    --accent:#E8EAED; --accent-soft:#22252A; --accent-ink:#FFFFFF;
    --flag:#E8EAED; --flag-soft:#23262B;
    --bubble:#1E2126;
    --sh:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#101215; --panel:#17191D; --rail-bg:#131518;
  --ink:#E8EAED; --ink-2:#A7AEB8; --ink-3:#787F8A;
  --line:#282B31; --line-2:#212429;
  --accent:#E8EAED; --accent-soft:#22252A; --accent-ink:#FFFFFF;
  --flag:#E8EAED; --flag-soft:#23262B;
  --bubble:#1E2126;
  --sh:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---------- top strip ---------- */
.strip{
  flex:0 0 auto; display:flex; align-items:center; gap:14px;
  padding:0 16px; height:48px;
  background:var(--panel); border-bottom:1px solid var(--line);
}
.mark{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:-.01em}
.mark-dot{width:9px;height:9px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.mockup{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px;
  text-transform:uppercase; letter-spacing:.08em;
  color:var(--flag); background:var(--flag-soft);
  border:1px solid color-mix(in srgb, var(--flag) 30%, transparent);
  padding:3px 7px; border-radius:3px; white-space:nowrap;
}
.strip-note{color:var(--ink-3);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip-sp{flex:1}
.ghost{
  background:transparent;border:1px solid var(--line);border-radius:6px;
  padding:5px 11px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;
}
.ghost:hover{border-color:var(--ink-3);color:var(--ink)}

/* ---------- shell ---------- */
.shell{
  flex:1; min-height:0; display:grid;
  grid-template-columns:var(--rail) 0fr minmax(0,1fr);
  transition:grid-template-columns .42s cubic-bezier(.22,.7,.2,1);
}
.shell.open{grid-template-columns:var(--rail) minmax(0,1fr) minmax(0,456px)}

/* ---------- rail ---------- */
.rail{
  background:var(--rail-bg); border-right:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0; overflow:hidden;
}
.rail-head{
  padding:16px 16px 9px; display:flex;align-items:baseline;gap:7px;
}
.eyebrow{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);
}
.count{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.rail-list{flex:1;min-height:0;overflow-y:auto;padding:0 8px 12px;display:flex;flex-direction:column;gap:2px}
.pg{
  width:100%;text-align:left;background:transparent;border:0;border-radius:7px;
  padding:9px 10px;display:block;position:relative;
}
.pg:hover{background:var(--line-2)}
.pg[aria-current="true"]{background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.pg[aria-current="true"] .pg-t{color:var(--accent-ink)}
.pg-t{font-weight:500;font-size:13.5px;display:block;letter-spacing:-.005em}
.pg-m{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);display:block;margin-top:2px}
.pg.touched{animation:touch 1.9s ease-out}
@keyframes touch{
  0%{background:var(--flag-soft);box-shadow:inset 2px 0 0 var(--flag)}
  70%{background:var(--flag-soft);box-shadow:inset 2px 0 0 var(--flag)}
  100%{background:transparent;box-shadow:none}
}
.pg-new{
  position:absolute;right:9px;top:9px;font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;letter-spacing:.06em;color:var(--flag);
}
.rail-foot{
  padding:11px 16px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ink-3);line-height:1.45;
}

/* ---------- doc ---------- */
.doc{
  background:var(--panel);border-right:1px solid var(--line);
  min-width:0;overflow:hidden;display:flex;flex-direction:column;
}
.doc-head{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:14px 22px;border-bottom:1px solid var(--line-2);
}
.doc-title{
  font-family:Newsreader,Georgia,serif;font-size:19px;font-weight:600;
  letter-spacing:-.01em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.doc-sp{flex:1}
.x{
  background:transparent;border:1px solid var(--line);border-radius:6px;
  width:26px;height:26px;display:grid;place-items:center;color:var(--ink-3);
  font-size:14px;line-height:1;flex:0 0 auto;
}
.x:hover{border-color:var(--ink-3);color:var(--ink)}
.doc-body{flex:1;min-height:0;overflow-y:auto;padding:26px 22px 40px}
.doc-inner{max-width:60ch}
.doc-body h2{
  font-family:Newsreader,Georgia,serif;font-size:15px;font-weight:600;
  letter-spacing:.01em;margin:26px 0 8px;color:var(--ink);
}
.doc-body h2:first-child{margin-top:0}
.doc-body p{
  font-family:Newsreader,Georgia,serif;font-size:15.5px;line-height:1.62;
  margin:0 0 10px;color:var(--ink-2);
}
.kv{
  display:flex;gap:10px;align-items:baseline;padding:7px 0;
  border-bottom:1px dashed var(--line);
}
.kv-k{font-family:Newsreader,Georgia,serif;font-size:15.5px;font-weight:500;color:var(--ink)}
.kv-d{flex:1;min-width:14px}
.kv-v{
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;text-align:right;
}
.blk.fresh{animation:fresh 2.4s ease-out}
@keyframes fresh{
  0%{background:var(--flag-soft);box-shadow:-12px 0 0 var(--flag-soft),-14px 0 0 var(--flag)}
  62%{background:var(--flag-soft);box-shadow:-12px 0 0 var(--flag-soft),-14px 0 0 var(--flag)}
  100%{background:transparent;box-shadow:none}
}
.doc-foot{
  flex:0 0 auto;padding:10px 22px;border-top:1px solid var(--line-2);
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);
  display:flex;gap:8px;align-items:center;
}

/* ---------- chat ---------- */
.chat{background:var(--ground);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.log{flex:1;min-height:0;overflow-y:auto;padding:22px 20px 8px;display:flex;flex-direction:column;gap:18px}
.turn{display:flex;flex-direction:column;gap:6px;max-width:100%}
.turn.u{align-items:flex-end}
.who{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--ink-3);
}
.bubble{
  max-width:85%;padding:9px 13px;border-radius:13px;font-size:13.8px;line-height:1.55;
}
.turn.u .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
:root[data-theme="dark"] .turn.u .bubble{color:#101215}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .turn.u .bubble{color:#101215}}
.turn.a .bubble{background:var(--bubble);border-bottom-left-radius:4px;max-width:92%}
.trace{
  display:flex;flex-direction:column;gap:1px;margin:1px 0 2px 2px;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);
}
.trace span{display:flex;gap:6px;align-items:center;animation:in .3s ease-out}
.trace b{color:var(--accent-ink);font-weight:500}
.trace i{font-style:normal;opacity:.55}
@keyframes in{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.dots{display:inline-flex;gap:3px;padding:2px 0}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--ink-3);animation:pulse 1.1s infinite}
.dots i:nth-child(2){animation-delay:.16s}
.dots i:nth-child(3){animation-delay:.32s}
@keyframes pulse{0%,60%,100%{opacity:.25}30%{opacity:.9}}

.composer{flex:0 0 auto;padding:12px 20px 18px;border-top:1px solid var(--line)}
.next-lbl{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--ink-3);margin-bottom:6px;display:block;
}
.field{
  background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;box-shadow:var(--sh);
}
.field-txt{font-size:13.8px;color:var(--ink-2);min-height:20px;line-height:1.5}
.field-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.field-hint{flex:1;font-size:11.5px;color:var(--ink-3)}
.send{
  background:var(--accent);color:#fff;border:0;border-radius:7px;
  padding:7px 14px;font-size:13px;font-weight:500;white-space:nowrap;
}
:root[data-theme="dark"] .send{color:#101215}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .send{color:#101215}}
.send:hover{background:var(--accent-ink)}
.send:disabled{background:var(--line);color:var(--ink-3);cursor:default}

.empty{
  flex:1;display:grid;place-items:center;padding:30px;text-align:center;
}
.empty p{max-width:34ch;color:var(--ink-3);font-size:13px;margin:0}

@media (max-width:900px){
  .shell,.shell.open{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .doc{position:absolute;inset:48px 0 0;border-right:0;z-index:5}
  .shell:not(.open) .doc{display:none}
  .shell.open .chat{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>

<div class="strip">
  <span class="mark"><span class="mark-dot"></span>Trip Binder</span>
  <span class="mockup">Mockup</span>
  <span class="strip-note">No backend &mdash; the conversation is scripted and the pages are hardcoded.</span>
  <span class="strip-sp"></span>
  <button class="ghost" id="reset">Start over</button>
</div>

<div class="shell open" id="shell">

  <aside class="rail">
    <div class="rail-head"><span class="eyebrow">Pages</span><span class="count" id="count"></span></div>
    <div class="rail-list" id="rail"></div>
    <div class="rail-foot">The bot names and creates these. There is no fixed list of categories.</div>
  </aside>

  <section class="doc" id="doc" aria-label="Page content">
    <div class="doc-head">
      <h1 class="doc-title" id="docTitle"></h1>
      <span class="doc-sp"></span>
      <button class="x" id="close" title="Close page" aria-label="Close page">&times;</button>
    </div>
    <div class="doc-body"><div class="doc-inner" id="docBody"></div></div>
    <div class="doc-foot"><span id="docFoot"></span></div>
  </section>

  <section class="chat" aria-label="Chat">
    <div class="log" id="log" aria-live="polite"></div>
    <div class="composer">
      <span class="next-lbl" id="nextLbl">Next scripted message</span>
      <div class="field">
        <div class="field-txt" id="nextTxt"></div>
        <div class="field-row">
          <span class="field-hint" id="hint"></span>
          <button class="send" id="send">Send</button>
        </div>
      </div>
    </div>
  </section>

</div>

<script>
"use strict";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- seed state: a trip already in progress ---------- */
function seed(){
  return {
    sel: "Flights",
    pages: [
      { title:"Flights", ago:"2 days ago", blocks:[
        {t:"h2", x:"Outbound"},
        {t:"kv", k:"Lisbon (LIS)", v:"3 Oct · $420 pp", id:"out"},
        {t:"p",  x:"Booked direct. Confirmation is in the email."},
        {t:"h2", x:"Return"},
        {t:"p",  x:"Not booked yet — depends how long we stay in Porto."}
      ]},
      { title:"Lisbon", ago:"2 days ago", blocks:[
        {t:"h2", x:"Where we’re staying"},
        {t:"kv", k:"Alfama", v:"3 nights"},
        {t:"p",  x:"Walkable to most of the old town, steep on the way back up."},
        {t:"h2", x:"Notes"},
        {t:"p",  x:"Trams fill up after about 10am. Go early or walk it."}
      ]}
    ],
    log: [
      {r:"u", x:"We’re flying into Lisbon on the 3rd, $420 each."},
      {r:"a", x:"Got it — started a Flights page with the outbound leg. How many nights in Lisbon before you head north?", trace:[["list_pages",""],["write_page","Flights"]]},
      {r:"u", x:"Three nights, we’ve got a place in Alfama."},
      {r:"a", x:"Noted on a new Lisbon page. Return flight is still open — I’ve left it flagged.", trace:[["list_pages",""],["write_page","Lisbon"]]}
    ]
  };
}

/* ---------- the scripted turns ---------- */
const SCRIPT = [
  {
    user:"Actually the flight moved to the 5th — same price.",
    trace:[["list_pages",""],["read_page","Flights"],["write_page","Flights"]],
    bot:"Updated Flights — outbound is now 5 Oct, still $420 each. That eats into the Alfama nights; want me to shorten the stay there or push the return?",
    demo:"F-06 · the bot read the page, then rewrote it. One flight on the page, not two.",
    apply(s){
      const p = s.pages.find(p=>p.title==="Flights");
      const kv = p.blocks.find(b=>b.id==="out");
      kv.v = "5 Oct · $420 pp"; kv.fresh = true;
      p.blocks.splice(3,0,{t:"p", x:"Moved from the 3rd. Same fare.", fresh:true});
      return ["Flights"];
    }
  },
  {
    user:"Someone recommended Livraria Lello in Porto.",
    trace:[["list_pages",""],["write_page","Sightseeing"]],
    bot:"New page: Sightseeing. Filed as a maybe — nothing booked. Worth knowing the timed tickets go fast in summer.",
    demo:"F-04 · nothing existing fit, so a new category got created — and named by the bot.",
    apply(s){
      s.pages.push({ title:"Sightseeing", ago:"just now", isNew:true, blocks:[
        {t:"h2", x:"Porto", fresh:true},
        {t:"kv", k:"Livraria Lello", v:"recommended", fresh:true},
        {t:"p",  x:"Timed-entry tickets, and they sell out in summer. Not booked.", fresh:true}
      ]});
      return ["Sightseeing"];
    }
  },
  {
    user:"We’ll rent a car to drive Lisbon → Porto, about €180 for three days.",
    trace:[["list_pages",""],["write_page","Transportation"]],
    bot:"New page: Transportation. €180 for three days, one-way to Porto.",
    demo:"A second new category. Watch what happens to it on the next message.",
    apply(s){
      s.pages.push({ title:"Transportation", ago:"just now", isNew:true, blocks:[
        {t:"h2", x:"Rental car", fresh:true},
        {t:"kv", k:"Lisbon → Porto", v:"€180 · 3 days", fresh:true},
        {t:"p",  x:"One-way drop-off in Porto. Not booked yet.", fresh:true}
      ]});
      return ["Transportation"];
    }
  },
  {
    user:"Also grabbing an Uber from the airport, maybe €25.",
    trace:[["list_pages",""],["read_page","Transportation"],["write_page","Transportation"]],
    bot:"Added that to Transportation rather than starting a separate page — same category. €25 airport transfer.",
    demo:"F-04, the part that matters — consolidation. A naïve bot starts a third page here called “Airport Transfer”.",
    apply(s){
      const p = s.pages.find(p=>p.title==="Transportation");
      p.blocks.push(
        {t:"h2", x:"Airport transfer", fresh:true},
        {t:"kv", k:"LIS → Alfama", v:"€25 approx", fresh:true}
      );
      return ["Transportation"];
    }
  },
  {
    user:"What have we got so far?",
    trace:[["list_pages",""]],
    bot:"Four pages. Flights — out on the 5th, $420 each, return still open. Lisbon — three nights in Alfama. Transportation — €180 car plus a €25 transfer. Sightseeing — Livraria Lello, unbooked. The return flight is the real gap.",
    demo:"Read-only turn. It looked at the pages and wrote nothing.",
    apply(){ return []; }
  }
];

let S = seed(), step = 0, busy = false;

const $ = id => document.getElementById(id);
const shell=$("shell"), rail=$("rail"), log=$("log"), doc=$("doc");

/* ---------- render ---------- */
function drawRail(touched){
  $("count").textContent = S.pages.length;
  rail.innerHTML = "";
  S.pages.forEach(p=>{
    const b = document.createElement("button");
    b.className = "pg" + (touched && touched.includes(p.title) ? " touched" : "");
    b.setAttribute("aria-current", S.sel === p.title ? "true" : "false");
    b.innerHTML = '<span class="pg-t"></span><span class="pg-m"></span>';
    b.querySelector(".pg-t").textContent = p.title;
    b.querySelector(".pg-m").textContent = p.ago;
    if(p.isNew){ const n=document.createElement("span"); n.className="pg-new"; n.textContent="NEW"; b.appendChild(n); }
    b.onclick = ()=>{ S.sel = p.title; drawRail(); drawDoc(); };
    rail.appendChild(b);
  });
}

function drawDoc(){
  const p = S.pages.find(p=>p.title===S.sel);
  shell.classList.toggle("open", !!p);
  if(!p) return;
  $("docTitle").textContent = p.title;
  $("docFoot").textContent = "updated " + p.ago;
  const body = $("docBody");
  body.innerHTML = "";
  p.blocks.forEach(bl=>{
    let el;
    if(bl.t === "h2"){ el = document.createElement("h2"); el.textContent = bl.x; }
    else if(bl.t === "p"){ el = document.createElement("p"); el.textContent = bl.x; }
    else {
      el = document.createElement("div"); el.className = "kv";
      el.innerHTML = '<span class="kv-k"></span><span class="kv-d"></span><span class="kv-v"></span>';
      el.querySelector(".kv-k").textContent = bl.k;
      el.querySelector(".kv-v").textContent = bl.v;
    }
    el.classList.add("blk");
    if(bl.fresh) el.classList.add("fresh");
    body.appendChild(el);
  });
  p.blocks.forEach(b=>{ delete b.fresh; });
}

function turnEl(r){
  const d = document.createElement("div");
  d.className = "turn " + r;
  const w = document.createElement("span");
  w.className = "who"; w.textContent = r === "u" ? "You" : "Bot";
  d.appendChild(w);
  return d;
}

function drawLog(){
  log.innerHTML = "";
  S.log.forEach(m=>{
    const d = turnEl(m.r);
    if(m.trace) d.appendChild(traceEl(m.trace));
    const b = document.createElement("div");
    b.className = "bubble"; b.textContent = m.x;
    d.appendChild(b);
    log.appendChild(d);
  });
  log.scrollTop = log.scrollHeight;
}

function traceEl(pairs){
  const t = document.createElement("div");
  t.className = "trace";
  pairs.forEach(([fn,arg])=>{
    const s = document.createElement("span");
    s.innerHTML = '<b></b><i></i>';
    s.querySelector("b").textContent = fn;
    s.querySelector("i").textContent = arg ? '→ ' + arg : "";
    t.appendChild(s);
  });
  return t;
}

function drawComposer(){
  const s = SCRIPT[step];
  if(!s){
    $("nextLbl").textContent = "End of script";
    $("nextTxt").textContent = "That’s the whole demo — five turns.";
    $("hint").textContent = "Start over to run it again.";
    $("send").disabled = true;
    $("send").textContent = "Done";
    return;
  }
  $("nextLbl").textContent = "Next scripted message · " + (step+1) + " of " + SCRIPT.length;
  $("nextTxt").textContent = s.user;
  $("hint").textContent = busy ? "Working…" : s.demo;
  $("send").disabled = busy;
  $("send").textContent = "Send";
}

/* ---------- play one scripted turn ---------- */
const wait = ms => new Promise(r=>setTimeout(r, reduce ? 0 : ms));

async function play(){
  const s = SCRIPT[step];
  if(!s || busy) return;
  busy = true; drawComposer();

  S.log.push({r:"u", x:s.user});
  drawLog();
  await wait(420);

  // bot turn: trace lines appear one at a time, page mutates, then text
  const d = turnEl("a");
  const tr = document.createElement("div"); tr.className = "trace";
  d.appendChild(tr);
  const dots = document.createElement("div");
  dots.className = "bubble"; dots.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  d.appendChild(dots);
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;

  let touched = [];
  for(let i=0;i<s.trace.length;i++){
    await wait(520);
    const [fn,arg] = s.trace[i];
    const line = document.createElement("span");
    line.innerHTML = '<b></b><i></i>';
    line.querySelector("b").textContent = fn;
    line.querySelector("i").textContent = arg ? '→ ' + arg : "";
    tr.appendChild(line);
    log.scrollTop = log.scrollHeight;

    if(fn === "write_page"){
      touched = s.apply(S);
      S.pages.forEach(p=>{ if(touched.includes(p.title)) p.ago = "just now"; });
      S.pages.sort((a,b)=> (a.ago==="just now"?-1:0) - (b.ago==="just now"?-1:0));
      drawRail(touched);
      drawDoc();
    }
  }

  await wait(560);
  dots.textContent = s.bot;
  S.log.push({r:"a", x:s.bot, trace:s.trace});
  log.scrollTop = log.scrollHeight;

  S.pages.forEach(p=>{ if(!touched.includes(p.title)) p.isNew = false; });
  step++; busy = false; drawComposer();
}

/* ---------- wire up ---------- */
$("send").onclick = play;
$("close").onclick = ()=>{ S.sel = null; drawRail(); shell.classList.remove("open"); };
$("reset").onclick = ()=>{ S = seed(); step = 0; busy = false; drawRail(); drawDoc(); drawLog(); drawComposer(); };

drawRail(); drawDoc(); drawLog(); drawComposer();
</script>
